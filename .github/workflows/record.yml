name: Agent - record a PR's tests

# Label a PR `record` and this records the suite as video and links the artifact.
#
# Deliberately NOT part of agent.yml. Recording hung a whole agent run on
# 2026-09-07: ffmpeg exited, twd-cli kept writing to the destroyed stream
# ("ffmpeg failed to write: Cannot call write after a stream was destroyed") and
# never gave up, so the job burned its 30 minutes and a finished implementation
# was lost before it could be pushed. `continue-on-error` does not cover a hang.
#
# So recording lives here, after the work is already safe on a branch, where a
# hang costs a video and nothing else. It doubles as the reproduction harness for
# the twd-cli bug: `timeout` bounds the call, ffmpeg's version and stderr are
# captured, and the log is uploaded whatever happens.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: record-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    if: github.event.label.name == 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # comment the artifact link, drop the label
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # The PR's head, not the merge commit: the point is to see the tests this
      # branch actually built.
      - name: Checkout the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # merge-base needs real history; a depth-1 checkout has no base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A STATIC ffmpeg, not Ubuntu's. Diagnosed 2026-09-07: Puppeteer 25.10 passes
      # `-movflags hybrid_fragmented`, the mp4 muxer cannot write its header
      # without it, ffmpeg exits 630ms in, and twd-cli writes to the dead stream
      # forever. See BRIKEV/twd-cli docs/bug-record-ffmpeg-hang.md.
      #
      # WHICH versions have it, measured rather than assumed: ubuntu-24.04's 6.1.1
      # does NOT, johnvansickle's "release" static build (7.0.2) does NOT, and
      # 8.1.2 does. So this pins the 8.1 series, the same series verified to work
      # on the machine where recording works. The next step proves it rather than
      # trusting this comment.
      - name: Install a modern ffmpeg
        run: |
          set -e
          FFDIR="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$FFDIR"
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            | tar -xJ --strip-components=1 -C "$FFDIR"
          # Located, not hardcoded: this archive puts the binary in bin/ while the
          # johnvansickle one puts it at the root, and guessing wrong surfaces two
          # steps later as an unhelpful "ffmpeg: not found".
          FFBIN="$(find "$FFDIR" -type f -name ffmpeg -perm -u+x | head -1)"
          test -n "$FFBIN" || { echo "::error::no ffmpeg binary found in the archive"; exit 1; }
          dirname "$FFBIN" >> "$GITHUB_PATH"

      # The CAPABILITY, not the version number: the flags come from Puppeteer and
      # move independently of ffmpeg's numbering, so assert the thing actually
      # required. Fails here, with a readable message, instead of as a dead stream
      # mid-run.
      - name: Verify ffmpeg can do what recording needs
        run: |
          set -e
          command -v ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -h muxer=mp4 | grep -q hybrid_fragmented \
            || { echo "::error::this ffmpeg has no -movflags hybrid_fragmented; recording cannot work"; exit 1; }
          echo "movflags hybrid_fragmented: ok"
          # The diagnostic wrapper twd.config.json points at. Exercised here so a
          # broken exec bit or shebang fails where the message is readable. It
          # resolves `ffmpeg` from PATH, so it picks up the static build above.
          test -x ./scripts/ffmpeg-log.sh
          ./scripts/ffmpeg-log.sh -version >/dev/null
          echo "wrapper ok"

      - name: Start Vite dev server
        run: |
          nohup npm run dev > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      # WHICH tests to record is a fact, so it is computed, not asked of a model:
      # the `it()` titles this branch added under src/twd-tests. Recording the
      # whole suite meant 10 tests at pace 400 for a reviewer who only wants to
      # see what the PR built — and a wrong title cannot be invented, because
      # twd-cli exits 1 with "No tests matched filter(s)".
      - name: Which tests did this branch add?
        id: titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .twd-agent
          node scripts/changed-test-titles.mjs "$BASE_SHA" > .twd-agent/titles.txt || true
          COUNT=$(grep -c . .twd-agent/titles.txt || true)
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "found ${COUNT:-0} added test(s):"
          sed 's/^/  - /' .twd-agent/titles.txt

      # `timeout` bounds the call from inside the step, so a hang exits non-zero
      # with the log intact rather than being cancelled by the step timeout, which
      # can take the output with it. 2 minutes: the whole point of filtering is
      # that three tests do not need six. twd-cli is pinned in package-lock.json,
      # so `npx` resolves the local binary.
      # ONE INVOCATION PER TITLE, not one run with several --test flags. Passing
      # them together is valid but documented to produce a single `run.<ext>`
      # with every matched test back to back; one test per invocation makes
      # twd-cli name each clip after its own "suite > test" path, so a reviewer
      # gets one watchable clip per acceptance criterion. Costs a browser launch
      # each, which is seconds.
      - name: Record the added tests
        id: record
        if: steps.titles.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -o pipefail
          mkdir -p .twd-agent
          FAILED=0
          while IFS= read -r title; do
            [ -z "$title" ] && continue
            echo "::group::recording — $title"
            timeout --signal=INT 60 npx twd-cli run --record --test "$title" 2>&1 \
              | tee -a .twd-agent/record.log || {
              echo "::warning::recording failed or timed out for: $title"
              FAILED=1
            }
            echo "::endgroup::"
          done < .twd-agent/titles.txt
          ls -la twd-artifacts/ 2>/dev/null || echo "no video produced"
          exit "$FAILED"

      # Puppeteer encodes VP9 with pix_fmt=gbrp (planar RGB) into an mp4, because
      # its input is PNG and its argument list sets no -pix_fmt. The file is valid
      # -- 111 frames decoded fine -- but QuickTime and Preview cannot open VP9 at
      # all, and gbrp is exotic even for players that can. A recording nobody can
      # play is not a recording, so transcode to the boring universal thing.
      # Measured on the first working run: 202805 -> 49222 bytes, same frames,
      # same duration. See BRIKEV/twd-cli docs/bug-record-ffmpeg-hang.md.
      - name: Make the clips playable
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in twd-artifacts/*.mp4 twd-artifacts/*.webm; do
            CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of csv=p=0 "$f")
            TMP="${f%.*}.h264.tmp.mp4"
            if ffmpeg -hide_banner -loglevel error -y -i "$f" \
                 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$TMP"; then
              mv -f "$TMP" "${f%.*}.mp4"
              echo "  $(basename "$f"): $CODEC -> h264,yuv420p ($(stat -c%s "${f%.*}.mp4") bytes)"
            else
              rm -f "$TMP"
              echo "::warning::could not transcode $f (left as $CODEC)"
            fi
          done
          ls -la twd-artifacts/ 2>/dev/null || true

      # Printed, not just uploaded: the whole point of the wrapper is to see WHY
      # ffmpeg exited, and making that require downloading and unzipping an
      # artifact is how a diagnostic goes unread.
      - name: What ffmpeg actually said
        if: always()
        run: |
          if [ -s .twd-agent/ffmpeg.log ]; then
            echo "::group::ffmpeg argv and stderr"
            cat .twd-agent/ffmpeg.log
            echo "::endgroup::"
          else
            echo "::warning::no ffmpeg.log — the wrapper was never invoked, so twd-cli did not use record.ffmpegPath"
          fi

      - name: Upload the recording and the logs
        id: video
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: twd-recording-pr-${{ github.event.pull_request.number }}
          path: |
            twd-artifacts/
            .twd-agent/record.log
            .twd-agent/ffmpeg.log
          if-no-files-found: warn
          retention-days: 14

      # A fork PR gets a read-only token and cannot comment, so this is best-effort.
      - name: Comment the link
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VIDEO_URL: ${{ steps.video.outputs.artifact-url }}
          OUTCOME: ${{ steps.record.outcome }}
        run: |
          if [ "$OUTCOME" = "skipped" ]; then
            gh pr comment "$PR_NUMBER" --body "Nothing to record: this branch added no TWD tests."
          elif [ "$OUTCOME" = "success" ] && [ -n "$VIDEO_URL" ]; then
            CLIPS=$(ls twd-artifacts/*.mp4 2>/dev/null | wc -l | tr -d ' ')
            gh pr comment "$PR_NUMBER" --body "Recording: ${CLIPS} clip(s), one per test this branch added — [download the artifact](${VIDEO_URL}) and unzip. h264/yuv420p, so any player opens them."
          else
            gh pr comment "$PR_NUMBER" --body "Recording failed (\`${OUTCOME}\`). The ffmpeg log is in the [run artifact](${VIDEO_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID})."
          fi

      - name: Drop the label
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label record
