name: CI - twd tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Lets the action post the contract validation summary as a PR comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Seconds, before any server starts: a broken test fails here, not in the browser.
      - name: Lint TWD tests
        run: npm run lint:twd

      # json-server first: /todos fetches on load from http://localhost:3001/api.
      - name: Start mock API
        run: |
          nohup npm run serve > json-server.log 2>&1 &
          npx wait-on http://localhost:3001/api/todos

      - name: Start Vite dev server
        run: |
          nohup npm run dev:ci > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      - name: Run TWD tests
        uses: BRIKEV/twd-cli/.github/actions/run@main
        with:
          contract-report: 'true'

      - name: Display coverage
        run: npm run collect:coverage:text
