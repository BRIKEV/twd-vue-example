name: EXPERIMENT - single job (firefox+webkit concurrent)

# Throwaway experiment: run BOTH engines in ONE job (concurrency:0 per
# twd.config.json) on a single runner, relying only on twd-runner's built-in
# warm-up. Answers "do users actually need the matrix, or is one job enough now?"
# Delete after we read the result.

on:
  push:
    branches: [ feat/cross-browser-twd-runner ]

jobs:
  single-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Vite dev server
        run: |
          nohup npm run dev > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      - name: Run TWD tests (firefox + webkit, same runner)
        uses: BRIKEV/twd-runner/.github/actions/run@main
