name: Cross-browser - twd-runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cross-browser:
    runs-on: ubuntu-latest

    # One job, both engines in parallel: `npx twd-runner run` launches every
    # browser in twd.config.json (firefox + webkit here) concurrently inside this
    # runner. No matrix, no CI-specific orchestration — the same two steps (start
    # dev server, run the runner) port verbatim to any CI. twd-runner warms the
    # dev server itself because waitForServiceWorker is set.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Vite dev server
        run: |
          nohup npm run dev > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      - name: Run TWD tests (firefox + webkit)
        uses: BRIKEV/twd-runner/.github/actions/run@main
