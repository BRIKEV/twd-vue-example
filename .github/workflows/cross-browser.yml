name: Cross-browser - twd-runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cross-browser:
    runs-on: ubuntu-latest

    # Run each engine in its own job on a fresh runner: full CPU/RAM per browser
    # (no cross-engine contention) and the three jobs run in parallel, so
    # wall-clock ~= the slowest single browser instead of the sum.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin this job to ${{ matrix.browser }}
        run: |
          tmp=$(mktemp)
          jq --arg b "${{ matrix.browser }}" '.browsers = [$b]' twd.config.json > "$tmp"
          mv "$tmp" twd.config.json
          cat twd.config.json

      - name: Start Vite dev server
        run: |
          nohup npm run dev > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      # Chromium for the warm-up only (the test engine is installed by the run
      # action). Loading the page once compiles the full module graph, runs
      # optimizeDeps, and activates the SW — so the matrix engine starts against
      # a fully warm server. This is what an all-browsers sequential run gets for
      # free (Chromium goes first); each parallel job needs it done explicitly,
      # otherwise Firefox/WebKit time out claiming the SW on a cold server.
      - name: Install Chromium for warm-up
        run: npx playwright install chromium

      - name: Warm up dev server (full page load + SW)
        run: node .github/scripts/warmup.mjs

      - name: Run TWD tests (${{ matrix.browser }})
        uses: BRIKEV/twd-runner/.github/actions/run@main
