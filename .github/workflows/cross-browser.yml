name: Cross-browser - twd-runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cross-browser:
    runs-on: ubuntu-latest

    # Run each engine in its own job on a fresh runner: full CPU/RAM per browser
    # (no cross-engine contention) and the three jobs run in parallel, so
    # wall-clock ~= the slowest single browser instead of the sum.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin this job to ${{ matrix.browser }}
        run: |
          tmp=$(mktemp)
          jq --arg b "${{ matrix.browser }}" '.browsers = [$b]' twd.config.json > "$tmp"
          mv "$tmp" twd.config.json
          cat twd.config.json

      - name: Start Vite dev server
        run: |
          nohup npm run dev > vite.log 2>&1 &
          npx wait-on http://localhost:5173
        env:
          CI: true

      # No warm-up step here: twd-runner warms the dev server itself when
      # waitForServiceWorker is enabled (twd.config.json), so each parallel job
      # starts against a hot server with no extra CI plumbing.
      - name: Run TWD tests (${{ matrix.browser }})
        uses: BRIKEV/twd-runner/.github/actions/run@main
